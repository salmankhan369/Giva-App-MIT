apiVersion: apps/v1
kind: Deployment
metadata:
  name: giva-app-deployment
  labels:
    app: giva-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: giva-app
  template:
    metadata:
      labels:
        app: giva-app
    spec:
      containers:
        - name: giva-app
          image: nginx:alpine
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
